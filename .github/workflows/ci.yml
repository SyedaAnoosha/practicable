name: CI

# week2_plan.md Phase 1 step 8 / W2-R2's acceptance: "CI runs the whole thing on push
# and blocks a red build." Four jobs — backend gating suite, frontend unit suite,
# Playwright + axe, and the frontend typecheck/build — each independently blocking.
#
# The backend and Playwright jobs run against the REAL Supabase Postgres project
# (backend/.env has no local-Postgres fallback — app/db/session.py's asyncpg dialect
# and BACKEND.md's pooler-mode notes are written against that one project), so every
# secret below must be set in the repo's Actions secrets before this goes green. Until
# then this workflow will correctly fail, which is the honest state to ship it in
# rather than silently skipping the jobs that need them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Every var backend/app/core/config.py's Settings requires — see backend/.env.example.
  # Secrets, not repo variables: all of these are live credentials.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
  SUPABASE_JWT_AUDIENCE: authenticated
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
  MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
  MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
  MUX_SIGNING_KEY_PRIVATE: ${{ secrets.MUX_SIGNING_KEY_PRIVATE }}
  SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
  SUPABASE_STORAGE_REGION: ${{ secrets.SUPABASE_STORAGE_REGION }}
  SUPABASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_ACCESS_KEY_ID }}
  SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_ACCESS_KEY }}
  SUPABASE_STORAGE_BUCKET_NAME: ${{ secrets.SUPABASE_STORAGE_BUCKET_NAME }}
  MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
  MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
  MAILJET_SENDER_EMAIL: ${{ secrets.MAILJET_SENDER_EMAIL }}
  MAILJET_SENDER_NAME: ${{ secrets.MAILJET_SENDER_NAME }}
  OWNER_NOTIFICATION_EMAIL: ${{ secrets.OWNER_NOTIFICATION_EMAIL }}
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
  ALLOWED_ORIGIN: http://localhost:5173

jobs:
  backend-gating:
    name: Backend — gating suite (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Gating suite must collect at least 25 tests
        # A cheap tripwire against the suite silently collecting zero tests (a renamed
        # file, a broken conftest import swallowing every test via a collection error)
        # and `pytest -q` reporting a false green because nothing ran. Non-negotiable
        # #9's "a test that has never failed has not been verified" applies to whether
        # the suite RAN at all, not only to individual assertions. 25 is the count as of
        # 2026-08-14 (24 from Phase 1/2's additions, plus one more when Phase 3 split
        # /questions into /questions/index + scored /questions and case 10 grew a
        # second assertion covering the scored endpoint's close rows) — raise this
        # number as tests are added, never lower it to make a broken collection pass.
        run: |
          COUNT=$(pytest tests/gating/ --collect-only -q | grep -c "::test_")
          echo "Collected $COUNT gating tests"
          test "$COUNT" -ge 25
      - run: pytest -q

  frontend-unit:
    name: Frontend — unit suite (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  frontend-typecheck-build:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Public, non-secret — the anon key is meant to ship in the client bundle
          # (BACKEND.md §10.1). Only the *backend* secrets above are sensitive.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    name: E2E — Playwright + axe
    runs-on: ubuntu-latest
    needs: [backend-gating, frontend-typecheck-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install and start the backend
        working-directory: backend
        run: |
          pip install -e .
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health || (cat backend.log && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright (gating + axe)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: http://localhost:8000
          E2E_BASE_URL: http://localhost:5173
          # Optional — the signed-in half of gating case 9 skips cleanly (not fails)
          # without these, per week2_plan.md's note on not creating live Supabase
          # accounts unattended. Set them as repo secrets once a dedicated test
          # account exists to bring that case fully into CI.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: "true"
        run: |
          npm run dev -- --port 5173 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 && break; sleep 1; done
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
