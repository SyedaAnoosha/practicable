<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Practicable">
  <!--
    `[REPLACED 2026-08-22]` The previous favicon.svg was a purple lightning bolt with
    fifteen blurred-ellipse filters — 9.5KB of scaffold artwork from a starter template,
    with no relationship to this product's identity. It was what every browser tab,
    bookmark and history entry showed.

    This is the product's own mark: the champagne square from the sidebar brand lockup
    (--gold #C6A961) on the navy stage (--stage #10213E), which is the one visual pairing
    that appears on every authenticated screen. Drawn at 32x32 with a single rounded
    rect, so it stays legible at the 16px a tab actually renders — a detailed glyph turns
    to mush at that size, which is why the mark is a solid, not a letterform.

    Colours are literal rather than tokens: an SVG loaded as a favicon has no access to
    the document's custom properties, and the tab strip is not theme-aware anyway.
  -->
  <rect width="32" height="32" rx="7" fill="#10213E"/>
  <rect x="9" y="9" width="14" height="14" rx="3.5" fill="#C6A961"/>
</svg>
