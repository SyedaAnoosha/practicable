# Render Blueprint (render.com/docs/blueprint-spec). Connect this repo in the Render
# dashboard -> New -> Blueprint, and it reads this file automatically. Every env var
# below has `sync: false` — Render prompts for the real value in its dashboard rather
# than this file ever holding a secret; committing this file is safe.
#
# week1_plan.md Phase 5 step 2: Starter tier, not Free — Free's cold start (the
# service spins down after 15 min idle, ~30-50s to wake) is not acceptable for a live
# checkout flow a Stripe redirect lands a paying customer on.
services:
  - type: web
    name: practicable
    runtime: python
    plan: starter
    region: singapore # closest Render region to the Supabase project's ap-south-1 pooler
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_KEY_PRIVATE
        sync: false
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_NAME
        sync: false
      # ── Email — Resend only [OWNER-DECIDED 2026-08-12] ───────────────────────
      # GMAIL_*, MAILJET_* and BREVO_* were removed from this blueprint along with
      # their transports. DELETE them by hand in Render -> Environment too: removing a
      # key here does not remove it from an already-provisioned service, and a stale
      # GMAIL_USER makes every send open a doomed TCP connection to smtp.gmail.com
      # first — Render blocks outbound port 587 ([Errno 101], docs/gmail.md §8) — which
      # costs a 15s timeout inside a Stripe webhook that has to answer fast.
      #
      # Adding a key here only creates the slot on a fresh Blueprint deploy; an
      # already-existing service needs each added by hand (see RUNNING.md §6.3).
      #
      # WARNING: Resend's sandbox sender only delivers to the Resend account's own
      # address, so no real buyer is emailed while this is the only transport. Receipts
      # are redirected to OWNER_NOTIFICATION_EMAIL, labelled undelivered. Verify a
      # domain at resend.com/domains before taking real money.
      - key: RESEND_API_KEY
        sync: false
      # Must equal the Resend account's own address, or every send returns 403. Also
      # the destination for redirected buyer receipts — never a customer address.
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false # set to the real Vercel URL once the frontend is deployed
