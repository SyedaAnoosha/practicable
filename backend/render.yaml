# Render Blueprint (render.com/docs/blueprint-spec). Connect this repo in the Render
# dashboard -> New -> Blueprint, and it reads this file automatically. Every env var
# below has `sync: false` — Render prompts for the real value in its dashboard rather
# than this file ever holding a secret; committing this file is safe.
#
# week1_plan.md Phase 5 step 2: Starter tier, not Free — Free's cold start (the
# service spins down after 15 min idle, ~30-50s to wake) is not acceptable for a live
# checkout flow a Stripe redirect lands a paying customer on.
services:
  - type: web
    name: practicable
    runtime: python
    plan: starter
    region: singapore # closest Render region to the Supabase project's ap-south-1 pooler
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_KEY_PRIVATE
        sync: false
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_NAME
        sync: false
      # ── Email — Mailjet only [OWNER-DECIDED 2026-08-15, week3_plan.md W3-R1] ──
      # GMAIL_*, BREVO_* and RESEND_* are gone from this blueprint. DELETE any of them
      # by hand in Render -> Environment too if left over from before: removing a key
      # here does not remove it from an already-provisioned service, and a stale
      # GMAIL_USER makes every send open a doomed TCP connection to smtp.gmail.com
      # first — Render blocks outbound port 587 ([Errno 101], docs/gmail.md §8) — which
      # costs a 15s timeout inside a Stripe webhook that has to answer fast. Mailjet is
      # a REST call over 443, unaffected by that block.
      #
      # Adding a key here only creates the slot on a fresh Blueprint deploy; an
      # already-existing service needs each added by hand (see RUNNING.md §6.3).
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      # Must be verified as a sender in the Mailjet dashboard (Senders, Domains &
      # Dedicated IPs -> Senders) or every send is rejected regardless of correct keys.
      - key: MAILJET_SENDER_EMAIL
        sync: false
      - key: MAILJET_SENDER_NAME
        value: Practicable
      # The destination for sale-alert notifications — never a customer address.
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      # For absolute links inside emails. Set to the real Vercel URL, same value as
      # ALLOWED_ORIGIN below once the frontend is deployed.
      - key: FRONTEND_URL
        sync: false
      # CORS preflight is an EXACT string match against this list, so the value must
      # be the origin only — scheme + host, no trailing slash and no path
      # (`https://prac-erm.vercel.app`, not `.../` or `.../courses`). Comma-separate
      # several for the production alias, `www`, and any preview domain that must
      # reach the API. Leaving this unset does not fail the deploy: the service boots
      # allowing localhost only and refuses the real frontend with 400 "Disallowed
      # CORS origin", which is visible in the browser console and nowhere else —
      # main.py now logs a warning at startup for exactly this case.
      - key: ALLOWED_ORIGIN
        sync: false # set to the real Vercel URL once the frontend is deployed
